<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Bobcat Compliance Run - 증빙 코드 디코더</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; height: 150px; padding: 10px; font-family: monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 20px; resize: vertical; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; display: block; width: 100%; margin-bottom: 20px; font-weight: bold; }
        button:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #f2f2f2; font-weight: bold; color: #333; }
        .error { color: red; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>증빙 코드 디코더</h1>
        <p>이메일로 접수된 증빙 코드를 아래에 입력하세요. 한 줄에 하나의 코드씩 여러 개를 동시에 입력할 수 있습니다.</p>
        <textarea id="hash-input" placeholder="예시:&#10;JUVBJUI5...&#10;JUVBJUI5..."></textarea>
        <button onclick="decodeHashes()">디코딩 실행</button>
        
        <table id="result-table" style="display:none;">
            <thead>
                <tr>
                    <th>원본 코드</th>
                    <th>성명</th>
                    <th>부서명</th>
                    <th>상태</th>
                </tr>
            </thead>
            <tbody id="result-body">
            </tbody>
        </table>
    </div>

    <script>
        function decodeHashes() {
            const input = document.getElementById('hash-input').value.trim();
            const resultTable = document.getElementById('result-table');
            const resultBody = document.getElementById('result-body');
            
            resultBody.innerHTML = '';
            
            if (!input) {
                alert("디코딩할 증빙 코드를 입력하세요.");
                resultTable.style.display = 'none';
                return;
            }
            
            const lines = input.split('\n').filter(line => line.trim() !== '');
            
            lines.forEach(line => {
                const tr = document.createElement('tr');
                const rawCodeTd = document.createElement('td');
                const codeStr = line.trim();
                
                // 긴 코드는 생략해서 표시
                rawCodeTd.innerText = codeStr.length > 20 ? codeStr.substring(0, 20) + "..." : codeStr;
                rawCodeTd.title = codeStr;
                
                const nameTd = document.createElement('td');
                const deptTd = document.createElement('td');
                const noteTd = document.createElement('td');
                
                try {
                    // Base64 디코딩 후 URI 디코딩
                    const decoded = decodeURIComponent(atob(codeStr));
                    const parts = decoded.split('|');
                    
                    if (parts.length >= 2) {
                        nameTd.innerText = parts[0];
                        deptTd.innerText = parts[1];
                        noteTd.innerText = "정상";
                        noteTd.style.color = "green";
                    } else {
                        throw new Error("Invalid Format");
                    }
                } catch (e) {
                    nameTd.innerText = "-";
                    deptTd.innerText = "-";
                    noteTd.innerText = "디코딩 실패 (변조/오류)";
                    noteTd.className = "error";
                }
                
                tr.appendChild(rawCodeTd);
                tr.appendChild(nameTd);
                tr.appendChild(deptTd);
                tr.appendChild(noteTd);
                resultBody.appendChild(tr);
            });
            
            resultTable.style.display = 'table';
        }
    </script>
</body>
</html>
